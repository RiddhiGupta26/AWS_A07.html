<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f5f8;
            color: #333;
            line-height: 1.5;
        }
        /* Header */

        header {
            background-color: #17365d;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            color: #dbe5f1;
        }

        /* Navigation */

        nav {
            background-color: #ffffff;
            padding: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: #17365d;
            font-weight: bold;
            padding: 8px 12px;
        }

        nav ul li a:hover {
            background-color: #e8eef5;
            border-radius: 5px;
        }

        /* Main Container */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 30px auto;
        }

        /* Form */

        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        /* Form Sections */

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #17365d;
            font-size: 20px;
            border-bottom: 2px solid #17365d;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        /* Two Column Layout */

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
        }

        /* Labels */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
        }
        .required {
            color: #b3261e;
        }
        /* Inputs */

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #b8c2cc;
            border-radius: 5px;
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #17365d;
            box-shadow: 0 0 0 2px rgba(23, 54, 93, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Radio Buttons */

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .radio-option input {
            width: auto;
        }

        .radio-option label {
            margin: 0;
            font-weight: normal;
        }

        /* Course Selection */

        .course-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .course-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid #d0d6dc;
            border-radius: 5px;
            background-color: #f8f9fa;
        }

        .course-option:hover {
            background-color: #eef3f8;
        }

        .course-option input {
            width: auto;
        }

        .course-option label {
            margin: 0;
            font-weight: normal;
        }

        /* Terms */

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .terms input {
            width: auto;
        }

        .terms label {
            margin: 0;
            font-weight: normal;
        }

        /* Buttons */

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 11px 28px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #17365d;
            color: white;
        }

        .submit-btn:hover {
            background-color: #0f2744;
        }

        .reset-btn {
            background-color: #e1e5e9;
            color: #333;
        }

        .reset-btn:hover {
            background-color: #cdd3d8;
        }

        /* Footer */

        footer {
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            color: #666;
            font-size: 13px;
        }

        /* Responsive Design */

        @media (max-width: 650px) {

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .course-grid {
                grid-template-columns: 1fr;
            }

            nav ul {
                gap: 10px;
            }

            form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->

    <header>
        <h1>Student Registration</h1>
        <p>Official Student Registration Form</p>
    </header>


    <!-- Navigation -->

    <nav>
        <ul>
            <li>
                <a href="home.html">Home</a>
            </li>
            <li>
                <a href="registrationForm2.html">Register</a>
            </li>

            <li>
                <a href="login.html">Log In</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->

    <div class="container">
        <form autocomplete="on">

            <!-- Personal Information -->

            <div class="section">

                <h2 class="section-title">
                    Personal Information
                </h2>

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">
                            First Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter first name"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">
                            Last Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter last name"
                            required>
                    </div>
                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="dob">
                            Date of Birth <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required>

                    </div>
                    <div class="form-group">

                        <label>
                            Gender <span class="required">*</span>
                        </label>

                        <div class="radio-group">
                            <div class="radio-option">
                                <input
                                    type="radio"
                                    id="male"
                                    name="gender"
                                    value="male"
                                    required>

                                <label for="male">Male</label>
                            </div>
                            <div class="radio-option">
                                <input
                                    type="radio"
                                    id="female"
                                    name="gender"
                                    value="female">

                                <label for="female">Female</label>
                            </div>
                            <div class="radio-option">
                                <input
                                    type="radio"
                                    id="other"
                                    name="gender"
                                    value="other">

                                <label for="other">Other</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->

            <div class="section">

                <h2 class="section-title">
                    Contact Information
                </h2>
                <div class="form-row">

                    <div class="form-group">

                        <label for="email">
                            Email Address <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required>

                    </div>
                    <div class="form-group">

                        <label for="phone">
                            Phone Number <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required>

                    </div>
                </div>
                <div class="form-group">

                    <label for="address">
                        Address <span class="required">*</span>
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your complete address"
                        required></textarea>
                </div>
            </div>

            <!-- Academic Information -->

            <div class="section">

                <h2 class="section-title">
                    Academic Information
                </h2>
                <div class="form-row">

                    <div class="form-group">

                        <label for="studentId">
                            Student ID / Enrollment No.
                        </label>

                        <input
                            type="text"
                            id="studentId"
                            name="studentId"
                            placeholder="Enter student ID">

                    </div>
                    <div class="form-group">

                        <label for="qualification">
                            Previous Qualification <span class="required">*</span>
                        </label>

                        <select
                            id="qualification"
                            name="qualification"
                            required>

                            <option value="">
                                Select qualification
                            </option>

                            <option value="12th">
                                Class 12 / Senior Secondary
                            </option>

                            <option value="diploma">
                                Diploma
                            </option>

                            <option value="undergraduate">
                                Undergraduate
                            </option>

                            <option value="postgraduate">
                                Postgraduate
                            </option>
                        </select>
                    </div>
                </div>
                <div class="form-row">

                    <div class="form-group">

                        <label for="college">
                            College / Institution <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="college"
                            name="college"
                            placeholder="Enter college name"
                            required>
                    </div>
                    <div class="form-group">

                        <label for="course">
                            Degree / Program <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="e.g. B.Tech CSE"
                            required>
                    </div>
                </div>
            </div>

            <!-- Course Selection -->

            <div class="section">

                <h2 class="section-title">
                    Course Selection
                </h2>

                <label>
                    Select the courses you are interested in:
                </label>


                <div class="course-grid">

                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course1"
                            name="courses"
                            value="dsa">

                        <label for="course1">
                            DSA / Competitive Programming
                        </label>

                    </div>


                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course2"
                            name="courses"
                            value="web">

                        <label for="course2">
                            Web Development
                        </label>

                    </div>


                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course3"
                            name="courses"
                            value="datascience">

                        <label for="course3">
                            Data Science
                        </label>
                    </div>
                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course4"
                            name="courses"
                            value="uiux">

                        <label for="course4">
                            UI/UX Designing
                        </label>
                    </div>
                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course5"
                            name="courses"
                            value="cybersecurity">

                        <label for="course5">
                            Cyber Security
                        </label>
                    </div>
                    <div class="course-option">

                        <input
                            type="checkbox"
                            id="course6"
                            name="courses"
                            value="ml">

                        <label for="course6">
                            Machine Learning
                        </label>

                    </div>

                </div>

            </div>


            <!-- Additional Information -->

            <div class="section">

                <h2 class="section-title">
                    Additional Information
                </h2>

                <div class="form-group">

                    <label for="message">
                        Additional Information
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Enter any additional information you would like to provide"></textarea>

                </div>

            </div>


            <!-- Terms -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required>

                <label for="terms">
                    I confirm that the information provided is correct.
                    <span class="required">*</span>
                </label>

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="submit"
                    class="submit-btn">
                    Submit Registration
                </button>

                <button
                    type="reset"
                    class="reset-btn">
                    Reset
                </button>

            </div>

        </form>

    </div>


    <!-- Footer -->

    <footer>
        © 2026 Student Registration Portal | All Rights Reserved
    </footer>

</body>

</html>
