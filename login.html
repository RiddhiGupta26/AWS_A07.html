<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        *,
        html,
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(250, 216, 223);
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: linear-gradient(135deg, #fad8df, #fff0f2);
        }

        form {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: rgb(255, 179, 179);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            text-decoration: underline;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: rgb(67, 146, 60);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(50, 120, 50);
        }
    </style>
</head>
<body>
    <form>
        <h1>Log In</h1>
        <label title="Enter your username" for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label title="Enter your password" for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Log In</button>
    </form>
    
</body>
</html>
